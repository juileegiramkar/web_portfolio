<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A11y Lens</title>
<meta name="description" content="Paste HTML and get an instant accessibility report: missing alt text, unlabeled form fields, heading order, link text, contrast and more, mapped to WCAG 2.2.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: tool shell. Editor on the left, report on the right; summary tiles above the findings list. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #16202a;
  --muted: #586574;
  --line: #d6dce3;
  --accent: #0e6e8c;
  --accent-ink: #ffffff;
  --err: #c0262d; --err-bg: #fde4e4;
  --warn: #9a5b00; --warn-bg: #fff0d6;
  --tip: #2453a6; --tip-bg: #e2ebfb;
  --pass: #1d7a3d; --pass-bg: #dcf3e3;
  --code-bg: #0f1720; --code-ink: #d7e2ec;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1318; --surface: #151d24; --ink: #e6edf3; --muted: #9aa8b5; --line: #26323d; --accent: #4cc3e0; --accent-ink: #062029;
    --err: #ff8a8f; --err-bg: #3a1a1c; --warn: #ffc066; --warn-bg: #3a2a10; --tip: #8db4ff; --tip-bg: #18263f; --pass: #7fdc9f; --pass-bg: #143322;
    --code-bg: #0a0f14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1318; --surface: #151d24; --ink: #e6edf3; --muted: #9aa8b5; --line: #26323d; --accent: #4cc3e0; --accent-ink: #062029;
  --err: #ff8a8f; --err-bg: #3a1a1c; --warn: #ffc066; --warn-bg: #3a2a10; --tip: #8db4ff; --tip-bg: #18263f; --pass: #7fdc9f; --pass-bg: #143322;
  --code-bg: #0a0f14; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.55 var(--font-body); }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.bar { background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .in { max-width: 1320px; margin: 0 auto; padding: 12px clamp(16px, 3vw, 28px); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 1.25rem; }
.brand p { font-size: 0.88rem; color: var(--muted); }
.theme-btn { font: inherit; font-size: 0.88rem; background: none; border: 1px solid var(--line); color: var(--ink); padding: 6px 12px; border-radius: 999px; cursor: pointer; }

.app { max-width: 1320px; margin: 0 auto; padding: 20px clamp(16px, 3vw, 28px) 40px; display: grid; grid-template-columns: 1fr 1.1fr; gap: 20px; align-items: start; }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.pane-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.pane-head h2 { font-size: 1rem; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 0.88rem; font-weight: 700; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
textarea { display: block; width: 100%; min-height: 520px; resize: vertical; border: 0; padding: 16px; font: 400 0.86rem/1.6 var(--font-mono); background: var(--code-bg); color: var(--code-ink); tab-size: 2; }
textarea:focus-visible { outline-offset: -3px; }
.editor-foot { padding: 8px 16px; font-size: 0.82rem; color: var(--muted); border-top: 1px solid var(--line); }

.summary { display: grid; grid-template-columns: 1.3fr repeat(4, 1fr); gap: 10px; padding: 16px; border-bottom: 1px solid var(--line); }
.score { display: flex; align-items: center; gap: 12px; }
.ring { --p: 0; width: 64px; height: 64px; border-radius: 50%; background: conic-gradient(var(--rc, var(--pass)) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; flex: none; }
.ring b { width: 50px; height: 50px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.score small { display: block; color: var(--muted); font-size: 0.8rem; }
.score strong { font-size: 1rem; }
.tile { border-radius: 10px; padding: 10px 12px; background: var(--bg); text-align: left; border: 2px solid transparent; font: inherit; color: inherit; cursor: pointer; }
.tile b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile span { font-size: 0.8rem; }
.tile.err b { color: var(--err); } .tile.warn b { color: var(--warn); } .tile.tip b { color: var(--tip); } .tile.pass b { color: var(--pass); }
.tile[aria-pressed="true"] { border-color: var(--accent); }

.findings { list-style: none; margin: 0; padding: 8px 16px 16px; display: grid; gap: 10px; max-height: 640px; overflow: auto; }
.f { border: 1px solid var(--line); border-left: 5px solid var(--sc); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.f.err { --sc: var(--err); } .f.warn { --sc: var(--warn); } .f.tip { --sc: var(--tip); } .f.pass { --sc: var(--pass); }
.f-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sev { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 999px; }
.err .sev { background: var(--err-bg); color: var(--err); } .warn .sev { background: var(--warn-bg); color: var(--warn); }
.tip .sev { background: var(--tip-bg); color: var(--tip); } .pass .sev { background: var(--pass-bg); color: var(--pass); }
.f h3 { font-size: 0.98rem; }
.wcag { margin-left: auto; font: 600 0.75rem var(--font-mono); color: var(--muted); }
.f p { font-size: 0.92rem; color: var(--muted); }
.f code { display: block; font: 0.78rem/1.5 var(--font-mono); background: var(--bg); padding: 6px 8px; border-radius: 6px; overflow-x: auto; white-space: pre; }
.f .fix { color: var(--ink); }
.f .fix::before { content: "Fix: "; font-weight: 700; }
.none { padding: 28px; text-align: center; color: var(--muted); }

@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  textarea { min-height: 320px; }
  .summary { grid-template-columns: repeat(2, 1fr); }
  .score { grid-column: 1 / -1; }
  .findings { max-height: none; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="in">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="15" cy="15" r="10" fill="none" stroke="var(--accent)" stroke-width="4"/><path d="M22.5 22.5 30 30" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/><circle cx="15" cy="11" r="2" fill="var(--accent)"/><path d="M10 14h10M15 14v4l-3 4M15 18l3 4" stroke="var(--accent)" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <div><h1>A11y Lens</h1><p>Paste HTML, get a WCAG 2.2 accessibility report. Runs in your browser; nothing is uploaded.</p></div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-pressed="false">Dark mode</button>
  </div>
</header>

<main class="app">
  <section class="pane" aria-labelledby="ed-title">
    <div class="pane-head">
      <h2 id="ed-title"><label for="src">HTML to check</label></h2>
      <div class="btns">
        <button class="btn" id="sampleBad" type="button">Load page with problems</button>
        <button class="btn" id="sampleGood" type="button">Load fixed page</button>
        <button class="btn primary" id="runBtn" type="button">Check again</button>
      </div>
    </div>
    <textarea id="src" spellcheck="false" aria-describedby="edHint"></textarea>
    <p class="editor-foot" id="edHint">Checks run as you type. Scripts in the pasted HTML are never run.</p>
  </section>

  <section class="pane" aria-labelledby="rep-title">
    <div class="pane-head"><h2 id="rep-title">Report</h2><span class="editor-foot" style="border:0;padding:0" id="checkedCount"></span></div>
    <div class="summary">
      <div class="score">
        <div class="ring" id="ring"><b id="scoreNum">0</b></div>
        <div><small>Accessibility score</small><strong id="scoreLabel"></strong></div>
      </div>
      <button class="tile err" type="button" data-sev="err" aria-pressed="false"><b id="nErr">0</b><span>Errors</span></button>
      <button class="tile warn" type="button" data-sev="warn" aria-pressed="false"><b id="nWarn">0</b><span>Warnings</span></button>
      <button class="tile tip" type="button" data-sev="tip" aria-pressed="false"><b id="nTip">0</b><span>Tips</span></button>
      <button class="tile pass" type="button" data-sev="pass" aria-pressed="false"><b id="nPass">0</b><span>Passed</span></button>
    </div>
    <ul class="findings" id="findings" aria-live="polite"></ul>
  </section>
</main>

<script>
/* ===================== Audit engine (pure: takes a source string, returns findings) ===================== */
var A11y = (function () {
  var VAGUE_LINKS = ['click here', 'here', 'read more', 'more', 'link', 'this link', 'learn more', 'details'];
  var BAD_ALT = /^(image|img|picture|photo|graphic|icon|untitled|spacer)$|\.(png|jpe?g|gif|svg|webp)$/i;

  function snip(el) {
    var h = el.outerHTML.replace(/\s+/g, ' ');
    var openEnd = h.indexOf('>') + 1;
    var s = h.length > 140 ? h.slice(0, Math.max(openEnd, 100)) + ' …' : h;
    return s.length > 180 ? s.slice(0, 180) + ' …' : s;
  }
  function text(el) { return (el.textContent || '').replace(/\s+/g, ' ').trim(); }
  function accName(el, doc) {
    if (el.getAttribute('aria-label') && el.getAttribute('aria-label').trim()) return el.getAttribute('aria-label').trim();
    var lb = el.getAttribute('aria-labelledby');
    if (lb) { var t = lb.split(/\s+/).map(function (id) { var r = doc.getElementById(id); return r ? text(r) : ''; }).join(' ').trim(); if (t) return t; }
    var t2 = text(el); if (t2) return t2;
    var imgs = el.querySelectorAll('img[alt]'); for (var i = 0; i < imgs.length; i++) if (imgs[i].getAttribute('alt').trim()) return imgs[i].getAttribute('alt').trim();
    if (el.getAttribute('title')) return el.getAttribute('title').trim();
    return '';
  }
  function parseColor(v) {
    if (!v) return null; v = v.trim().toLowerCase();
    var named = { white: '#ffffff', black: '#000000', gray: '#808080', grey: '#808080', silver: '#c0c0c0', red: '#ff0000', yellow: '#ffff00', blue: '#0000ff', navy: '#000080', green: '#008000' };
    if (named[v]) v = named[v];
    var m = v.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/);
    if (m) { var h = m[1].length === 3 ? m[1].replace(/(.)/g, '$1$1') : m[1]; return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
    m = v.match(/^rgba?\(\s*(\d+)[\s,]+(\d+)[\s,]+(\d+)/);
    return m ? [+m[1], +m[2], +m[3]] : null;
  }
  function lum(rgb) { var c = rgb.map(function (x) { x /= 255; return x <= 0.04045 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
  function ratio(a, b) { var l1 = lum(a), l2 = lum(b); return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05); }
  function styleProp(el, prop) {
    var s = el.getAttribute('style') || '';
    var m = s.match(new RegExp('(?:^|;)\\s*' + prop + '\\s*:\\s*([^;]+)', 'i'));
    return m ? m[1].trim() : null;
  }
  function inheritedBg(el) {
    for (var n = el; n && n.getAttribute; n = n.parentElement) {
      var b = styleProp(n, 'background-color') || styleProp(n, 'background');
      var c = parseColor(b && b.split(' ')[0]); if (c) return c;
    }
    return [255, 255, 255];
  }

  function audit(src) {
    var doc = new DOMParser().parseFromString(src, 'text/html');
    var out = [];
    var checksRun = 0;
    function check(id, title, wcag, fn) {
      checksRun++;
      var before = out.length;
      fn(function (sev, msg, fix, el) { out.push({ id: id, sev: sev, title: title, wcag: wcag, msg: msg, fix: fix, code: el ? snip(el) : null }); });
      if (out.length === before) out.push({ id: id, sev: 'pass', title: title, wcag: wcag, msg: 'No problems found.', fix: null, code: null });
    }
    var isFullDoc = /<html[\s>]/i.test(src);

    check('lang', 'Page language is set', '3.1.1', function (add) {
      if (!isFullDoc) return;
      var lang = doc.documentElement.getAttribute('lang');
      if (!lang || !lang.trim()) add('err', 'The <html> element has no lang attribute, so screen readers may use the wrong pronunciation.', 'Add lang="en" (or the page’s language) to <html>.', null);
    });
    check('title', 'Page has a title', '2.4.2', function (add) {
      if (!isFullDoc) return;
      if (!doc.title.trim()) add('err', 'The page has no <title>. It is the first thing a screen reader announces and the name shown in browser tabs.', 'Add a short, unique <title> in <head>.', null);
    });
    check('img-alt', 'Images have text alternatives', '1.1.1', function (add) {
      doc.querySelectorAll('img').forEach(function (img) {
        if (!img.hasAttribute('alt')) add('err', 'Image has no alt attribute. Screen readers may read the file name instead.', 'Describe the image in alt="…", or use alt="" if it is decorative.', img);
        else if (BAD_ALT.test(img.getAttribute('alt').trim())) add('warn', 'Alt text “' + img.getAttribute('alt') + '” does not describe the image.', 'Write what the image shows or why it is there.', img);
      });
    });
    check('link-name', 'Links have clear text', '2.4.4', function (add) {
      doc.querySelectorAll('a[href]').forEach(function (a) {
        var n = accName(a, doc);
        if (!n) add('err', 'Link has no text, so screen readers announce only “link”.', 'Add visible text, or aria-label on icon-only links.', a);
        else if (VAGUE_LINKS.indexOf(n.toLowerCase().replace(/[.!…]+$/, '')) !== -1) add('warn', 'Link text “' + n + '” makes no sense out of context. Screen reader users often browse a list of links.', 'Say where the link goes, like “Download the fall syllabus (PDF)”.', a);
        if (a.getAttribute('target') === '_blank' && !/new (tab|window)/i.test(n)) add('tip', 'Link opens a new tab without telling the user.', 'Add “(opens in new tab)” to the link text or aria-label.', a);
      });
    });
    check('button-name', 'Buttons have names', '4.1.2', function (add) {
      doc.querySelectorAll('button, [role="button"], input[type="button"], input[type="submit"]').forEach(function (b) {
        var n = b.tagName === 'INPUT' ? (b.getAttribute('value') || b.getAttribute('aria-label') || '') : accName(b, doc);
        if (!n.trim()) add('err', 'Button has no accessible name.', 'Add text inside the button, or aria-label for icon buttons.', b);
      });
    });
    check('form-label', 'Form fields have labels', '1.3.1, 3.3.2', function (add) {
      doc.querySelectorAll('input, select, textarea').forEach(function (f) {
        var type = (f.getAttribute('type') || '').toLowerCase();
        if (['hidden', 'submit', 'button', 'reset', 'image'].indexOf(type) !== -1) return;
        var id = f.getAttribute('id');
        var labelled = (id && doc.querySelector('label[for="' + id.replace(/"/g, '\\"') + '"]')) || f.closest('label') || f.getAttribute('aria-label') || f.getAttribute('aria-labelledby') || f.getAttribute('title');
        if (!labelled) add('err', 'Form field has no label.' + (f.getAttribute('placeholder') ? ' Placeholder text disappears when typing and is not a label.' : ''), 'Add <label for="…"> that matches the field’s id.', f);
      });
    });
    check('headings', 'Headings are in order', '1.3.1, 2.4.6', function (add) {
      var hs = Array.prototype.slice.call(doc.querySelectorAll('h1, h2, h3, h4, h5, h6'));
      if (!hs.length) { add('warn', 'Page has no headings. Screen reader users navigate by headings.', 'Mark section titles with <h1>–<h6>.', null); return; }
      var h1s = hs.filter(function (h) { return h.tagName === 'H1'; });
      if (!h1s.length) add('warn', 'Page has no <h1>.', 'Use one <h1> for the main page title.', null);
      if (h1s.length > 1) add('tip', 'Page has ' + h1s.length + ' <h1> elements.', 'Usually one <h1> per page is clearest.', h1s[1]);
      var prev = 0;
      hs.forEach(function (h) {
        var lvl = +h.tagName[1];
        if (!text(h) && !h.querySelector('img[alt]:not([alt=""])')) add('err', 'Heading is empty.', 'Add text or remove the empty heading.', h);
        if (prev && lvl > prev + 1) add('warn', 'Heading jumps from h' + prev + ' to h' + lvl + ', skipping a level.', 'Use h' + (prev + 1) + ' here, and style it with CSS if it needs to look smaller.', h);
        prev = lvl;
      });
    });
    check('tables', 'Data tables have headers', '1.3.1', function (add) {
      doc.querySelectorAll('table').forEach(function (t) {
        if (t.getAttribute('role') === 'presentation') return;
        if (!t.querySelector('th')) add('warn', 'Table has no <th> header cells, so screen readers cannot say which column a value belongs to.', 'Use <th scope="col"> for column headers.', t);
        if (!t.querySelector('caption') && !t.getAttribute('aria-label')) add('tip', 'Table has no caption.', 'Add a <caption> that says what the table shows.', t);
      });
    });
    check('contrast', 'Text has enough contrast', '1.4.3', function (add) {
      doc.querySelectorAll('[style]').forEach(function (el) {
        var fg = parseColor(styleProp(el, 'color'));
        if (!fg || !text(el)) return;
        var r = ratio(fg, inheritedBg(el));
        var size = parseFloat(styleProp(el, 'font-size')) || 16;
        var large = size >= 24 || (size >= 18.66 && /bold|[6-9]00/.test(styleProp(el, 'font-weight') || ''));
        var need = large ? 3 : 4.5;
        if (r < need) add('err', 'Contrast is ' + (Math.floor(r * 100) / 100).toFixed(2) + ':1; ' + (large ? 'large' : 'normal') + ' text needs at least ' + need + ':1.', 'Darken the text or lighten the background.', el);
      });
    });
    check('media', 'Media is captioned and does not autoplay', '1.2.2, 1.4.2', function (add) {
      doc.querySelectorAll('video').forEach(function (v) {
        if (!v.querySelector('track[kind="captions"], track[kind="subtitles"]')) add('warn', 'Video has no captions track.', 'Add <track kind="captions" src="…vtt" srclang="en">.', v);
      });
      doc.querySelectorAll('video[autoplay]:not([muted]), audio[autoplay]').forEach(function (v) {
        add('warn', 'Media plays sound automatically, which interrupts screen readers.', 'Remove autoplay, or mute it and show controls.', v);
      });
      doc.querySelectorAll('iframe').forEach(function (f) {
        if (!(f.getAttribute('title') || '').trim()) add('err', 'Embedded frame has no title.', 'Add title="…" describing the embed, like “Lecture 3 video”.', f);
      });
    });
    check('ids', 'IDs are unique', '4.1.1', function (add) {
      var seen = {};
      doc.querySelectorAll('[id]').forEach(function (el) {
        var id = el.id; if (seen[id]) add('warn', 'The id “' + id + '” is used more than once, which can break labels and links.', 'Give every element a unique id.', el); seen[id] = true;
      });
    });

    var order = { err: 0, warn: 1, tip: 2, pass: 3 };
    out.sort(function (a, b) { return order[a.sev] - order[b.sev]; });
    var count = function (s) { return out.filter(function (f) { return f.sev === s; }).length; };
    var score = Math.max(0, 100 - count('err') * 10 - count('warn') * 4 - count('tip'));
    return { findings: out, checks: checksRun, score: score, counts: { err: count('err'), warn: count('warn'), tip: count('tip'), pass: count('pass') } };
  }
  return { audit: audit, ratio: ratio, parseColor: parseColor };
})();

/* ===================== UI ===================== */
(function () {
  var BAD = '<!DOCTYPE html>\n<html>\n<head>\n  <meta charset="utf-8">\n</head>\n<body>\n  <h1>Intro to Biology</h1>\n  <img src="banner.jpg">\n  <h3>Week 1 readings</h3>\n  <p style="color:#9a9a9a">Read chapters 1 and 2 before class.</p>\n  <a href="syllabus.pdf">Click here</a> for the syllabus.\n  <a href="https://example.edu/lab" target="_blank"><img src="lab-icon.png" alt="icon"></a>\n\n  <h2>Office hours sign-up</h2>\n  <form>\n    <input type="email" placeholder="Your email">\n    <select id="day"><option>Tuesday</option></select>\n    <button><svg width="16" height="16"></svg></button>\n  </form>\n\n  <table>\n    <tr><td>Week</td><td>Topic</td></tr>\n    <tr><td>1</td><td>Cells</td></tr>\n  </table>\n\n  <iframe src="https://example.com/lecture1"></iframe>\n  <video src="lecture1.mp4" autoplay></video>\n  <p id="note">Quiz on Friday.</p>\n  <p id="note">Bring a calculator.</p>\n</body>\n</html>';
  var GOOD = '<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <title>Intro to Biology – Week 1</title>\n</head>\n<body>\n  <h1>Intro to Biology</h1>\n  <img src="banner.jpg" alt="Students looking at plant cells through microscopes">\n  <h2>Week 1 readings</h2>\n  <p style="color:#4a4a4a">Read chapters 1 and 2 before class.</p>\n  <p><a href="syllabus.pdf">Download the syllabus (PDF)</a></p>\n  <a href="https://example.edu/lab" target="_blank"><img src="lab-icon.png" alt="Virtual lab (opens in new tab)"></a>\n\n  <h2>Office hours sign-up</h2>\n  <form>\n    <label for="email">Email</label>\n    <input id="email" type="email" autocomplete="email">\n    <label for="day">Day</label>\n    <select id="day"><option>Tuesday</option></select>\n    <button aria-label="Submit sign-up"><svg width="16" height="16" aria-hidden="true"></svg></button>\n  </form>\n\n  <table>\n    <caption>Weekly topics</caption>\n    <tr><th scope="col">Week</th><th scope="col">Topic</th></tr>\n    <tr><td>1</td><td>Cells</td></tr>\n  </table>\n\n  <iframe src="https://example.com/lecture1" title="Lecture 1 video"></iframe>\n  <video src="lecture1.mp4" controls>\n    <track kind="captions" src="lecture1.vtt" srclang="en" label="English">\n  </video>\n  <p id="quiz">Quiz on Friday.</p>\n  <p id="calc">Bring a calculator.</p>\n</body>\n</html>';

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return s.replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  var LABEL = { err: 'Error', warn: 'Warning', tip: 'Tip', pass: 'Passed' };
  var filter = null, last = null, timer;

  function run() {
    last = A11y.audit($('src').value);
    var c = last.counts;
    $('nErr').textContent = c.err; $('nWarn').textContent = c.warn; $('nTip').textContent = c.tip; $('nPass').textContent = c.pass;
    $('scoreNum').textContent = last.score;
    $('ring').style.setProperty('--p', last.score);
    $('ring').style.setProperty('--rc', last.score >= 90 ? 'var(--pass)' : last.score >= 60 ? 'var(--warn)' : 'var(--err)');
    $('scoreLabel').textContent = last.score >= 90 ? 'Looks good' : last.score >= 60 ? 'Needs work' : 'Major barriers';
    $('checkedCount').textContent = last.checks + ' checks run';
    render();
  }
  function render() {
    var list = last.findings.filter(function (f) { return !filter || f.sev === filter; });
    $('findings').innerHTML = list.length ? list.map(function (f) {
      return '<li class="f ' + f.sev + '"><div class="f-top"><span class="sev">' + LABEL[f.sev] + '</span><h3>' + esc(f.title) + '</h3><span class="wcag">WCAG ' + f.wcag + '</span></div>' +
        '<p>' + esc(f.msg) + '</p>' + (f.code ? '<code>' + esc(f.code) + '</code>' : '') + (f.fix ? '<p class="fix">' + esc(f.fix) + '</p>' : '') + '</li>';
    }).join('') : '<li class="none">Nothing in this category.</li>';
  }

  document.querySelectorAll('.tile').forEach(function (t) {
    t.addEventListener('click', function () {
      filter = filter === t.dataset.sev ? null : t.dataset.sev;
      document.querySelectorAll('.tile').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.sev === filter)); });
      render();
    });
  });
  $('src').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(run, 250); });
  $('runBtn').addEventListener('click', run);
  $('sampleBad').addEventListener('click', function () { $('src').value = BAD; run(); });
  $('sampleGood').addEventListener('click', function () { $('src').value = GOOD; run(); });

  var root = document.documentElement, tb = $('themeBtn');
  function dark() { var t = root.getAttribute('data-theme'); return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
  function sync() { tb.textContent = dark() ? 'Light mode' : 'Dark mode'; tb.setAttribute('aria-pressed', String(dark())); }
  tb.addEventListener('click', function () { root.setAttribute('data-theme', dark() ? 'light' : 'dark'); sync(); });
  sync();

  $('src').value = BAD;
  run();
})();
</script>
</body>
</html>
